services:
  front-v2:
    image: xfenix/xfenix-ru-front-v2:latest
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - challenge_mount:/var/www/certbot
      - /srv/www/xfenix-v2.ru/presentations:/srv/presentations:ro
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  certbot:
    image: certbot/certbot:v5.6.0
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - challenge_mount:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot certonly -d xfenix.ru --non-interactive --agree-tos --webroot --webroot-path /var/www/certbot/; sleep 12h & wait $${!}; done;'"
  back:
    image: xfenix/xfenix-ru-back:latest
    env_file: .env
    volumes:
      - /srv/www/xfenix-v2.ru/:/var/lib/xfenix.ru
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 5
  remote-broker:
    image: peerjs/peerjs-server:latest
    # ENTRYPOINT образа — node peerjs.js, аргументы подставляются к нему.
    # --proxied: nginx терминирует TLS, серверу нужны реальные IP клиентов для лимитов.
    command: "--port 9000 --path / --key peerjs --proxied"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
  # TURN-ретранслятор пульта slidemachina. Хостовая сеть обязательна: UDP 3478 и
  # ретрансляционные UDP-порты 49152-65535 не должны проходить через NAT compose-сети.
  turn-relay:
    image: coturn/coturn:4.6.2
    network_mode: host
    volumes:
      - ./back/turnserver.conf:/etc/coturn/turnserver.conf:ro
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
volumes:
  challenge_mount:
