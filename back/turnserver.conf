# Ретранслятор TURN для пульта slidemachina: несет трафик WebRTC там, где прямой путь
# между устройствами не пробился (классика — телефон в VPN против обычной сети).
# Порт 3478 (UDP и TCP) должен быть открыт на фаерволе хоста, плюс UDP-диапазон ретрансляции ниже.
listening-port=3478
fingerprint
lt-cred-mech
user=slidemachina:__SLIDEMACHINA_TURN_CREDENTIAL__
realm=xfenix.ru
log-file=stdout
min-port=49152
max-port=65535
# Лимиты нагрузки: пульту хватает с запасом, а гнать чужой трафик через ретранслятор бессмысленно.
user-quota=5
total-quota=50
max-bps=256000
# Не ретранслировать в частные сети: закрывает трюк с доступом во внутреннюю сеть через TURN.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
